name: SHIVASHA Docker validation

on:
  push:
    branches: [main, master]
    paths:
      - 'Dockerfile'
      - 'frontend.Dockerfile'
      - 'docker-compose.yml'
      - 'nginx.conf'
      - 'server/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docker-validation.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'Dockerfile'
      - 'frontend.Dockerfile'
      - 'docker-compose.yml'
      - 'nginx.conf'
      - 'server/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docker-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-and-image-build:
    name: Validate Compose and build SHIVASHA images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose configuration
        env:
          JWT_SECRET: ci-only-placeholder-secret-not-for-production
        run: docker compose -f docker-compose.yml config --quiet

      - name: Build backend image
        run: docker build --file Dockerfile --tag shivasha-backend:ci .

      - name: Build frontend image
        run: docker build --file frontend.Dockerfile --tag shivasha-frontend:ci .
