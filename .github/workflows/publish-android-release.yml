name: Publish SHIVASHA Android Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 1.0.1)"
        required: true
        default: "1.0.1"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Build web app
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_APP_VERSION: ${{ inputs.version }}
        run: npm run build -- --base=./

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release create "v${RELEASE_VERSION}" "android/app/build/outputs/apk/debug/app-debug.apk#SHIVASHA-v${RELEASE_VERSION}.apk" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "SHIVASHA v${RELEASE_VERSION}" \
            --notes "SHIVASHA Android update release. APK is provided for testing and installation." \
            --latest
