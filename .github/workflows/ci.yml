name: Shivasha CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend
        run: npm run build

  backend-syntax:
    name: Backend tests, MongoDB integration and syntax check
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017/shivasha_hr_test
      JWT_SECRET: ci-only-hr-integration-secret-not-for-production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        working-directory: server
        run: npm install
      - name: Run backend tests
        working-directory: server
        run: npm test

      - name: Check backend JavaScript syntax
        shell: bash
        run: |
          set -e
          while IFS= read -r file; do
            node --check "$file"
          done < <(find server -type f -name '*.js' -not -path '*/node_modules/*')
