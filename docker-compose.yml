services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - shivasha_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Intentionally not published to the host: database stays private to Docker.

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env file}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/shivasha}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
    expose:
      - "5000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "${SHIVASHA_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  shivasha_mongo_data:
